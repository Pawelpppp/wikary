<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d18">
    <title>Przygody Księdza Kamila</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="cabinet">
      <header class="masthead">
        <p class="eyebrow">PARAFIALNY PROTOKÓŁ PRZYGÓD</p>
        <h1>Przygody Księdza Kamila</h1>
      </header>
      <section class="game-frame" aria-label="Gra Przygody Księdza Kamila">
        <canvas id="game" width="960" height="540" aria-label="Ekran gry"></canvas>
        <form id="score-form" class="score-form" hidden>
          <label for="nickname">Wpisz nick (do 12 znaków)</label>
          <div class="score-form-row">
            <input id="nickname" name="nickname" maxlength="12" autocomplete="nickname" required>
            <button type="submit">ZAPISZ</button>
          </div>
        </form>
        <div class="touch-controls" aria-label="Sterowanie dotykowe">
          <button type="button" data-key="ArrowLeft" aria-label="W lewo">◀</button>
          <button type="button" data-key="Space" aria-label="Skok">SKOK</button>
          <button type="button" data-key="Alt" aria-label="Rzut krzyżem">✝</button>
          <button type="button" data-key="ArrowRight" aria-label="W prawo">▶</button>
        </div>
      </section>
      <footer>
        <span>STRZAŁKI — ruch</span><span>SPACJA — skok / salto</span>
        <span>ALT — krzyż</span><span>Z — ogień</span>
        <span>X — błogosławieństwo</span><span>PRZYTRZYMAJ SHIFT — grom</span>
      </footer>
    </main>
    <script src="src/game.js"></script>
  </body>
</html>
